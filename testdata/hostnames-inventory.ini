# Varied hostname lengths (to exercise the host-name shrink algorithm) plus
# one genuinely unreachable host (short connect timeout so it fails fast,
# to exercise the outcomeUnreachable path for real).
[all]
web1 ansible_connection=local
database-primary ansible_connection=local
cache-node-alpha ansible_connection=local
ghost ansible_host=203.0.113.1 ansible_connection=ssh ansible_ssh_common_args='-o ConnectTimeout=2 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
