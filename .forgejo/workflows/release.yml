# Forgejo Actions — cut a release when a vX.Y.Z tag is pushed.
#
#   git tag -a v0.3.0 -m "v0.3.0"
#   git push origin v0.3.0
#
# Requires a registered Forgejo runner with a Docker or host executor and
# outbound network access (Go module proxy, github.com for goreleaser).
#
# Only actions/checkout and actions/setup-go are used — both mirrored on
# code.forgejo.org, so this works with the stock DEFAULT_ACTIONS_URL.
# GoReleaser is installed directly rather than via goreleaser/goreleaser-action
# (not in the actions/ namespace, not mirrored).
#
# GoReleaser publishes the release to code.aw.net (the canonical repo). A
# final step copies the same dist/ artifacts onto the GitHub mirror's
# release, since a git push-mirror replicates refs but not release assets.
# Needs a GitHub PAT (Contents: read+write on claude42/tangsible) stored as
# the Forgejo Actions secret GH_MIRROR_TOKEN.

name: release

on:
  push:
    tags:
      - "v*"

# No `permissions:` block — Forgejo doesn't implement it and skips any job
# that carries one. The auto-injected token's scope comes from repo/instance
# settings; by default it can create releases on its own repo.

jobs:
  goreleaser:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/node:20-bookworm   # generic CI image: git + Node for JS actions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          check-latest: true

      - name: Run GoReleaser
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          goreleaser release --clean
        env:
          # Auto-injected by the Forgejo runner, scoped to this repo.
          # Swap for a dedicated PAT secret (Settings -> Applications,
          # scope write:repository) if your instance restricts the
          # automatic token from writing releases.
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Mirror artifacts to the GitHub release
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          REPO="claude42/tangsible"

          # gh is not in the base image — fetch the static binary.
          GH_VERSION=2.63.2
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=2 "gh_${GH_VERSION}_linux_amd64/bin/gh"

          # The mirror only pushes the tag; create the release object if it
          # isn't there yet, otherwise reuse it.
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file dist/CHANGELOG.md

          gh release upload "$TAG" --repo "$REPO" --clobber \
            dist/*.tar.gz dist/*_checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GH_HOST: github.com
          GITHUB_TOKEN: ""   # Forgejo injects its own; keep gh off it
