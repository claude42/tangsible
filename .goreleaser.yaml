# GoReleaser config — https://goreleaser.com
#
# Local dry run (no publish, no tag needed):
#   goreleaser release --snapshot --clean
# Real release (on a pushed tag vX.Y.Z, with GITEA_TOKEN set):
#   goreleaser release --clean
#
# The Forgejo instance at code.aw.net speaks the Gitea v1 API, so the
# "gitea" publisher and gitea_urls below target it unchanged.

version: 2

project_name: tangsible

# Forgejo's runner auto-injects GITHUB_TOKEN alongside our GITEA_TOKEN;
# without this GoReleaser errors "multiple tokens found".
force_token: gitea

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # Python's own bytecode cache (regenerated locally by anything that
    # imports callback/tangsible_events.py, e.g. an ansible-playbook run
    # against it) - .gitignore'd, but archives.files' own callback/* glob
    # below isn't git-aware, so a stray local cache would otherwise ship
    # in the release tarball. A "^"-prefixed exclude-glob archive.files
    # entry looks like the documented way to filter this instead, but
    # doesn't actually work in this GoReleaser version (confirmed empirically
    # - it silently matches nothing rather than excluding anything), so
    # removing the source before archiving is the one thing actually
    # verified to work.
    - rm -rf callback/__pycache__

builds:
  - id: tangsible
    main: .
    binary: tangsible
    env:
      - CGO_ENABLED=0            # tview/tcell are pure Go -> static binary
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      # CommitDate (not .Date/"now") for a real, tagged release - so
      # building the same tag twice, on different machines or days,
      # produces a byte-identical binary. A --snapshot build is a local,
      # throwaway dev artifact with no such reproducibility goal, and the
      # commit it's built from is often the same across several snapshot
      # builds in a row (uncommitted local edits in between) - so it gets
      # the actual wall-clock build time instead, specifically so
      # `tangsible version`'s own "built:" line can answer "is this
      # actually the one I just built, or did I forget to reinstall."
      - -X main.date={{ if .IsSnapshot }}{{ .Date }}{{ else }}{{ .CommitDate }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: tangsible
    formats: [tar.gz]
    # tangsible_0.3.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Extract into a subdir of the same name instead of spilling into cwd.
    wrap_in_directory: true
    # The binary lands at the wrapper dir's root; everything else is grouped
    # so install.sh (also bundled) can place each component with its own
    # prompt — run from the unpacked archive it installs in "local" mode.
    files:
      - LICENSE
      - README.md
      - src: install.sh
        info:
          mode: 0755
      - src: man/*.1
        dst: man
      - src: completions/*
        dst: completions
      # The bundled ansible callback plugin.
      - src: callback/*
        dst: callback
      # A full-defaults config.toml (design-docs/ConfigOptions.md) and an
      # example theme (design-docs/ColorConfig.md's own addendum) - copy
      # what you want from these into .tangsible/config.toml or a real
      # theme file; Tangsible never reads this directory itself. Recurses
      # into examples/themes/ same as callback/* above.
      - src: examples/*
        dst: examples

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge branch"

release:
  gitea:
    owner: claude
    name: tangsible
  draft: false
  prerelease: auto   # vX.Y.Z-rc1 etc. are flagged automatically
  # Don't hard-fail if the release already exists (e.g. re-running a job
  # that died in the later GitHub-mirror step) — just add missing files.
  mode: keep-existing

gitea_urls:
  api: https://code.aw.net/api/v1
  download: https://code.aw.net
  skip_tls_verify: false
