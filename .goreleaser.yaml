# GoReleaser config — https://goreleaser.com
#
# Local dry run (no publish, no tag needed):
#   goreleaser release --snapshot --clean
# Real release (on a pushed tag vX.Y.Z, with GITEA_TOKEN set):
#   goreleaser release --clean
#
# The Forgejo instance at code.aw.net speaks the Gitea v1 API, so the
# "gitea" publisher and gitea_urls below target it unchanged.

version: 2

project_name: tangsible

# Forgejo's runner auto-injects GITHUB_TOKEN alongside our GITEA_TOKEN;
# without this GoReleaser errors "multiple tokens found".
force_token: gitea

before:
  hooks:
    - go mod tidy
    - go vet ./...
    # Debian policy wants man pages and the changelog gzipped, and nFPM
    # doesn't do it. -n drops the name/mtime so the output is reproducible.
    # Not under dist/: GoReleaser refuses a non-empty dist/ even after hooks
    # ran. Gitignored.
    - sh -c 'rm -rf pkg-gz && mkdir pkg-gz && for f in man/*.1 Changelog.md; do gzip -9n -c "$f" > "pkg-gz/$(basename "$f").gz"; done'

builds:
  - id: tangsible
    main: .
    binary: tangsible
    env:
      - CGO_ENABLED=0            # tview/tcell are pure Go -> static binary
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      # CommitDate (not .Date/"now") for a real, tagged release - so
      # building the same tag twice, on different machines or days,
      # produces a byte-identical binary. A --snapshot build is a local,
      # throwaway dev artifact with no such reproducibility goal, and the
      # commit it's built from is often the same across several snapshot
      # builds in a row (uncommitted local edits in between) - so it gets
      # the actual wall-clock build time instead, specifically so
      # `tangsible version`'s own "built:" line can answer "is this
      # actually the one I just built, or did I forget to reinstall."
      - -X main.date={{ if .IsSnapshot }}{{ .Date }}{{ else }}{{ .CommitDate }}{{ end }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: tangsible
    formats: [tar.gz]
    # tangsible_0.3.0_linux_amd64.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Extract into a subdir of the same name instead of spilling into cwd.
    wrap_in_directory: true
    # The binary lands at the wrapper dir's root; everything else is grouped
    # so install.sh (also bundled) can place each component with its own
    # prompt — run from the unpacked archive it installs in "local" mode.
    files:
      - LICENSE
      - README.md
      - Changelog.md
      - src: install.sh
        info:
          mode: 0755
      - src: man/*.1
        dst: man
      - src: completions/*
        dst: completions
      # A full-defaults config.toml (design-docs/ConfigOptions.md) and an
      # example theme (design-docs/ColorConfig.md's own addendum) - copy
      # what you want from these into .tangsible/config.toml or a real
      # theme file; Tangsible never reads this directory itself. Recurses
      # into examples/themes/.
      - src: examples/*
        dst: examples

# Linux packages, built by nFPM straight from the binaries (no dpkg needed).
# File layout: PACKAGING.md. Only linux builds are packaged.
nfpms:
  - id: tangsible
    package_name: tangsible
    ids: [tangsible]
    formats: [deb, rpm]
    # tangsible_0.3.0_amd64.deb, tangsible-0.3.0-1.x86_64.rpm
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: AW/NET
    maintainer: Tangsible Maintainer <tangsible@aw.net>
    description: |-
      TUI wrapper for ansible-playbook
      Tangsible runs ansible-playbook and shows the run as a live,
      navigable tree of plays, tasks and hosts, with per-task output,
      diffs, resolved variables and module docs one keystroke away.
      It can also re-run failed tasks, replay saved runs, render
      templates, inspect hosts and edit vaults.
    homepage: https://code.aw.net/claude/tangsible
    license: Apache-2.0
    section: admin
    bindir: /usr/bin
    # tangsible shells out to ansible-playbook/-doc/-inventory/-config,
    # all shipped by ansible-core.
    dependencies:
      - ansible-core
    rpm:
      group: Development/Tools
    contents:
      - src: pkg-gz/*.1.gz
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      - src: completions/tangsible.bash
        dst: /usr/share/bash-completion/completions/tangsible
        file_info:
          mode: 0644
      - src: completions/tangsible.fish
        dst: /usr/share/fish/vendor_completions.d/tangsible.fish
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/tangsible/README.md
        type: doc
        file_info:
          mode: 0644
      # Debian-only: the copyright file and the changelog's Debian name.
      - src: packaging/deb/copyright
        dst: /usr/share/doc/tangsible/copyright
        packager: deb
        file_info:
          mode: 0644
      - src: pkg-gz/Changelog.md.gz
        dst: /usr/share/doc/tangsible/changelog.gz
        packager: deb
        file_info:
          mode: 0644
      # rpm-only: the license goes under /usr/share/licenses, the changelog
      # stays a plain doc.
      - src: LICENSE
        dst: /usr/share/licenses/tangsible/LICENSE
        type: license
        packager: rpm
        file_info:
          mode: 0644
      - src: pkg-gz/Changelog.md.gz
        dst: /usr/share/doc/tangsible/Changelog.md.gz
        type: doc
        packager: rpm
        file_info:
          mode: 0644
      - src: examples/*
        dst: /usr/share/doc/tangsible/examples
        file_info:
          mode: 0644

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge branch"

release:
  gitea:
    owner: claude
    name: tangsible
  draft: false
  prerelease: auto   # vX.Y.Z-rc1 etc. are flagged automatically
  # Don't hard-fail if the release already exists (e.g. re-running a job
  # that died in the later GitHub-mirror step) — just add missing files.
  mode: keep-existing

gitea_urls:
  api: https://code.aw.net/api/v1
  download: https://code.aw.net
  skip_tls_verify: false

# Publishes the .deb files to Forgejo's Debian package registry, which users
# add to apt (PACKAGING.md, "apt repository"). One PUT per file; Forgejo reads
# the architecture from the .deb itself, so the target has no file name.
# Needs a token with write:package for the registry owner in the
# PACKAGES_TOKEN env var (a Forgejo Actions secret in CI).
uploads:
  - name: forgejo-deb
    ids: [tangsible]
    exts: [deb]
    method: PUT
    custom_artifact_name: true       # target below is the whole URL
    username: claude
    password: "{{ .Env.PACKAGES_TOKEN }}"
    target: https://code.aw.net/api/packages/claude/debian/pool/stable/main/upload
